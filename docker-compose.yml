services:
  db:
    image: postgres:16-alpine
    container_name: tiendix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiendix
      POSTGRES_PASSWORD: tiendix
      POSTGRES_DB: tiendix
    ports:
      - "5432:5432"
    volumes:
      - tiendix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiendix -d tiendix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tiendix-db-data:
